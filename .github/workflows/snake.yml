name: Generar snake arcade

on:
  schedule:
    - cron: "0 0 * * *"   # se actualiza todos los días
  workflow_dispatch:       # permite correrlo a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-arcade.svg?palette=github-dark&color_snake=#ff2b2b&color_dots=#1a0505,#4d0000,#800000,#b30000,#ff2b2b

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
